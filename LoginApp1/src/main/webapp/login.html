<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal - Sign In</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="card">
            <div class="card-header">
                <div class="brand-icon">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 2L1 7l11 5 9-4.09V17h2V7L12 2zm0 13.5L4.5 12 3 12.67l9 4.33 9-4.33-1.5-.67L12 15.5zm0 4L4.5 16 3 16.67l9 4.33 9-4.33-1.5-.67L12 19.5z"/>
                    </svg>
                </div>
                <h2>Student Portal</h2>
                <p>Welcome back! Please enter your details to sign in.</p>
            </div>

            <form id="loginForm" action="Login.jsp" method="post">
                <div class="form-group">
                    <label for="user_id">User ID or Enrollment No</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </span>
                        <input type="text" id="user_id" name="user_id" placeholder="e.g. admin or enrollment no" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-container">
                        <span class="input-icon">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </span>
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <button type="submit" class="btn-primary" id="loginSubmitBtn">
                        <span>Sign In</span>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="5" y1="12" x2="19" y2="12"></line>
                            <polyline points="12 5 19 12 12 19"></polyline>
                        </svg>
                    </button>
                </div>

                <div class="footer-nav">
                    Don't have an account? <a href="info.html">Register New Student</a>
                    <div style="margin-top: 10px;">
                        <a href="viewStudent.jsp" class="btn-secondary">View Registered Directory</a>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
